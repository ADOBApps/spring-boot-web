<!DOCTYPE html>
<linkh="https://www.thymeleaf.org">
<html>
<head>
	<meta charset="utf-8"/>
	<!--<meta name="viewport" content="width=device-width, initial-scale=1"/>-->
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title th:text="${title}"></title>

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
	<!-- Optional theme -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
	<!-- Optional static -->

	<link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav id="siteNav" class="navbar navbar-default navbar-fixed-top" role="navigation">
	<div class="container">
		<!-- Logo and responsive toggle -->
		<div class="navbar-header">
			<button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar">
				<span class="sr-only" th:text="${title}"></span>
				<span class="icon-bar"></span>
				<span class="icon-bar"></span>
				<span class="icon-bar"></span>
			</button>
			<a class="navbar-brand" href="/">
				<span class="glyphicon glyphicon-grain" th:text="${title}"></span> 
			</a>
		</div>
		<!-- Navbar links -->
		<div class="collapse navbar-collapse" id="navbar">
			<ul class="nav navbar-nav navbar-right">
				<li class="active">
					<a class="nav-link" href="/app/">Home</a>
				</li>
				<li class="dropdown">
					<a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">More<span class="caret"></span></a>
					<ul class="dropdown-menu" aria-labelledby="about-us">
						<li><a class="nav-link" href="" data-toggle="modal" data-target="#moda_tab_1">Contactanos</a></li>
					</ul>
				</li>
			</ul>
		</div>			
	</div>
</nav>

<header>
	<div class="header-content">
		<div class="header-content-inner">
			<!-- <h1 th:text="${titulo}"></h1> -->
			<hr class="my-4">
			<hr class="my-4">
		</div>
	</div>
</header>

<section>
<div class="content">
	<div class="container-fluid">
		<!--@SPRINGBOOT-->
		<div id="resizable" class="ui-widget-content form-group">
			<div class="ui-widget-header well well-sm">Resizable</div>
			<label for="datepicker">Date</label>
			<input type="text" id="datepicker" class="form-control">
			<label for="lang_predict">Language</label>
			<input id="lang_predict" class="form-control" title="Available languages">
		</div>
		<div class="widget">
			<fieldset>
			    <legend>Rental Car</legend>
			    <div class="controlgroup controlgroup-vertical">
					<select id="car-type">
						<option>Compact car</option>
						<option>Midsize car</option>
						<option>Full size car</option>
					</select>
					<label for="transmission-standard">Standard</label>
			      	<input type="radio" name="transmission" id="transmission-standard">
			      	<label for="transmission-automatic">Automatic</label>
			      	<input type="radio" name="transmission" id="transmission-automatic">
			      	<label for="insurance">Insurance</label>
			      	<input type="checkbox" name="insurance" id="insurance">
			      	<label for="horizontal-spinner" class="ui-controlgroup-label"># of cars</label>
			      	<input id="horizontal-spinner" class="ui-spinner-input">
			      	<button>Book Now!</button>
			    </div>
			</fieldset>
		</div>
	</div>
	<hr class="my-4">
</section>

<div class="container">
	<div class="row">
		<div class="col-sm-3 col-md-6">
			<p class="ui-state-default ui-corner-all ui-helper-clearfix" style="padding:4px;">
			  <span class="ui-icon ui-icon-pencil" style="float:left; margin:-2px 5px 0 0;"></span>
			  Simple Colorpicker
			</p>
			<div class="widget">
				<div id="red_slider"></div>
				<div id="green_slider"></div>
				<div id="blue_slider"></div>
				<div id="swatch" class="ui-widget-content ui-corner-all"></div>
			</div>
		</div>
		<div class="col-sm-3 col-md-6">
			<div class="well">Test</div>
		</div>
	</div>
</div>

<!-- Modal 1 template -->
<div class="container">
	<div class="modal fade" id="moda_tab_1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
		<div class="modal-dialog"> 
			<div class="modal-content">
				<div class="modal-header"> 
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button> 
					<h4 class="modal-title" id="myModalLabel"></h4> 
				</div> 
				<div class="modal-body jumbotron">
					<h1 class="display-4">ADOB Apps</h1>
					  <p class="lead">Simplicidad con elegancia.</p>
					  <hr class="my-4">
					  <p>(...)</p>
					  <a class="btn btn-primary btn-lg" href="/app/" role="button">inicio</a>
				</div> 
				<div class="modal-footer"> 
					<button type="button" class="btn btn-default" data-dismiss="modal">Close</button> 
				</div> 
			</div> 
		</div> 
	</div>
</div>
<!-- Modal 1 template -->

<!-- Modal 2 template -->
<div class="container">
	<div class="modal fade" id="moda_tab_2" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
		<div class="modal-dialog"> 
			<div class="modal-content">
				<div class="modal-header"> 
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button> 
					<h4 class="modal-title" id="myModalLabel"></h4> 
				</div> 
				<div class="modal-body"></div> 
				<div class="modal-footer"> 
					<button type="button" class="btn btn-default" data-dismiss="modal">Close</button> 
				</div> 
			</div> 
		</div> 
	</div>
</div>
<!-- Modal 2 template -->

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
<!-- Bootstrap -->

<!--JQuery UI-->
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
<script th:src="@{/js/script.js}"></script>
<!--JQuery UI-->

<!-- Footer -->
<footer class="page-footer jumbotron">
	<!-- Contact Us -->
	<div class="contact">
		<div class="container">
			<h2 class="section-heading">Contáctanos</h2>
			<p><span class="glyphicon glyphicon-envelope"></span><br>acxelorozco@gmail.com</p>
			<p><span class="glyphicon glyphicon-fire"></span><br/>Powered by ADOB Apps</p> 
		</div>
	</div>
	<!-- Copyright etc -->
	<div class="small-print">
		<div class="container">
			<p>Copyright &copy; ADOB Apps 2024</p>
		</div>
	</div>
</footer>

</body>
</html>
